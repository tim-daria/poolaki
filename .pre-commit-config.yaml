repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
    - id: mypy
      name: mypy (uv)
      entry: bash -c 'cd backend/django && uv run mypy .'
      language: system
      types: [python]
      pass_filenames: false
