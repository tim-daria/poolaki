repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
    - id: mypy
      name: mypy (uv)
      entry: bash -c 'cd backend/django && uv run mypy .'
      language: system
      types: [python]
      pass_filenames: false

    - id: pytest
      name: pytest (uv)
      entry: bash -c 'cd backend/django && uv run pytest'
      language: system
      types: [python]
      pass_filenames: false
      always_run: true

    - id: django-check
      name: django check (uv)
      entry: >
        bash -c 'cd backend/django && uv run python manage.py check'
      language: system
      types: [python]
      pass_filenames: false

    - id: missing-migrations
      name: check for missing migrations (uv)
      entry: >
        bash -c 'cd backend/django && uv run python manage.py makemigrations --check --dry-run'
      language: system
      types: [python]
      pass_filenames: false

    - id: migrate
      name: apply migrations (uv)
      entry: >
        bash -c 'cd backend/django && uv run python manage.py migrate'
      language: system
      types: [python]
      pass_filenames: false