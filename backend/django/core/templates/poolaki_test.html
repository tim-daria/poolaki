<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Poolaki Testpage</title>

	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">

	<style>
		body {
			font-family: "Open Sans", sans-serif;
			background-color: rgba(0, 0, 0, 0.1);
			margin: 0px;
		}

		header {
			background-color: rgb(194, 161, 255);
			display: flex;
			padding-left: 20px;
			box-shadow: 2px, 2px, 2px rgba(0, 0, 0, 0.1);
		}

		button {
			height: 60px;
			width: 60px;
			border-radius: 50%;
			background-color: rgb(233, 46, 87);
			box-shadow: 2px, 2px, 2px rgba(0, 0, 0, 0.1);
			margin-top: 15px;
			margin-left: 20px;
			color: white;
			font-size: xx-large
		}

	</style>
</head>

<body>
	<header>
		<h1>Poolaki Testpage - Add User</h1>

		<button onclick="addUser()">
			+
		</button>

		<script>
			function addUser() {
				let email = prompt('Add E-Mail');
				let password_hash = prompt('Add Password');
				let name = prompt('Add Username');

				let token = '{{ csrf_token }}';	// django command - token comes from django for authentication

				let formData = new FormData();
				formData.append('email', email);
				formData.append('password_hash', password_hash);
				formData.append('name', name);
				formData.append('csrfmiddlewaretoken', token);

				fetch('/api/test/', {
					method: 'POST',
					body: formData
				});

				// window.location.reload();

			}
		</script>

	</header>

	{% for row in all_user %}
		<div>
			<p>
				User:
			</p>
			<ul>
				<li>
					{{ row.email }}
				</li>
				<li>
					{{ row.password_hash}}
				</li>
				<li>
					{{row.name}}
				</li>
			</ul>
		</div>
	{% endfor %}

</body>
</html>
