services:
  # cloudflared:
  #   image: cloudflare/cloudflared:latest
  #   container_name: cloudflared
  #   restart: unless-stopped
  #   command: tunnel --no-autoupdate --loglevel info --metrics 0.0.0.0:60123 run
  #   environment:
  #     TUNNEL_TOKEN: ${TUNNEL_TOKEN}
  #   networks:
  #     - tunnel_net
  
  caddy:
    image: caddy:2.11-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      TZ: Europe/Berlin
    volumes:
      - ./backend/caddy/:/etc/caddy
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - tunnel_net
      - frontend_net
      - backend_net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:2019/config/"]
      interval: 30s
      retries: 3
      start_period: 10s
      timeout: 5s
    depends_on:
      backend:
        condition: service_healthy
        restart: true
      frontend:
        condition: service_healthy
        restart: true

  backend:
    build:
      context: ./backend
      dockerfile: django/Dockerfile
    container_name: django
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    expose:
    - "8000"
    environment:
      TZ: Europe/Berlin
      VAULT_ADDR: http://vault:8200
      VAULT_ROLE_ID_FILE: /run/secrets/vault_role_id
      VAULT_SECRET_ID_FILE: /run/secrets/vault_secret_id
      DB_HOST: db
      DB_PORT: "5432"
    volumes:
      - ./backend/django:/app
    tmpfs:
      - /tmp:exec,mode=777
    # env_file:
    #   - .env
    networks:
      - backend_net
      - vault_net
    secrets:
      - vault_role_id
      - vault_secret_id
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/')"]
      interval: 30s
      retries: 3
      start_period: 30s
      timeout: 5s
    depends_on:
      db:
        condition: service_healthy
        restart: true

  db:
    image: postgres:18
    container_name: postgres_db
    restart: unless-stopped
    volumes:
      - postgres_db:/var/lib/postgresql/
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # PG Values are needed for psql to restore the database from backup
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      TZ: Europe/Berlin
      VAULT_ADDR: "http://vault:8200"
    networks:
      - backend_net
      - backup_net
      - vault_net
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: ./Dockerfile
    container_name: nodejs
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    expose:
      - "5173"
    environment:
      TZ: Europe/Berlin
      # - NODE_ENV=production
    volumes:
      - ./frontend:/home/node/app
      - /home/node/app/node_modules
    develop:
      watch:
        - action: rebuild
          path: ./frontend/package.json
        - action: rebuild
          path: ./frontend/package-lock.json
    networks:
      - frontend_net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:5173"]
      interval: 30s
      retries: 3
      start_period: 30s
      timeout: 5s

######################################################
# Monitoring #
######################################################

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    restart: unless-stopped
    expose:
      - "9090"
    environment:
      TZ: Europe/Berlin
    volumes:
      - ./backend/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./backend/monitoring/prometheus_data:/var/prometheus
    networks:
      - tunnel_net
      - backend_net
      - frontend_net
      - backup_net
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 30s
      retries: 3
      start_period: 15s
      timeout: 5s

  grafana:
    image: grafana/grafana:13.1
    container_name: grafana
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: "https://grafana.localhost"
      GF_USERS_ALLOW_SIGN_UP: false
      GF_AUTH_ANONYMOUS_ENABLED: false
      GF_AUTH_DISABLE_LOGIN_FORM: false
      GF_SECURITY_COOKIE_SECURE: true
      GF_SECURITY_STRICT_TRANSPORT_SECURITY: true
      # SMTP Settings
      GF_SMTP_ENABLED: true
      GF_SMTP_HOST: ${SMTP_HOST}
      GF_SMTP_USER: ${SMTP_USER}
      GF_SMTP_PASSWORD: ${SMTP_PASSWORD}
      GF_SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS}
      GF_SMTP_FROM_NAME: "Grafana Alerts"
      GF_SMTP_SKIP_VERIFY: false
      GF_UNIFIED_ALERTING_ENABLED: "true"
      GF_FEATURE_TOGGLES_ENABLE: "provisioningWithEnvVars"
      ALERT_RECIPIENT_EMAIL: ${ALERT_RECIPIENT_EMAIL}
      TZ: Europe/Berlin
    volumes:
      - ./backend/monitoring/grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    networks:
      - backend_net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      retries: 3
      start_period: 15s
      timeout: 5s
    depends_on:
      prometheus:
        condition: service_healthy
        restart: true

  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    container_name: postgres_exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres_db:5432/${POSTGRES_DB}?sslmode=disable"
    networks:
      - backend_net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9187/metrics"]
      interval: 30s
      retries: 3
      start_period: 10s
      timeout: 5s
    depends_on:
      db:
        condition: service_healthy
        restart: true

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    expose:
      - "8080"
    networks:
      - tunnel_net
      - backend_net
      - frontend_net
      - backup_net
    depends_on:
      - caddy

######################################################
# Backup #
######################################################

  db_backup:
    image: postgres:18
    container_name: db_backup
    restart: unless-stopped
    volumes:
      - ./backend/backups:/backups
      - ./backend/backups/backup.sh:/backup.sh
    entrypoint: ["sh", "-c", "while true; do sh /backup.sh; sleep 86400; done"]
    networks:
      - backup_net
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      TZ: Europe/Berlin
    healthcheck:
      test: ["CMD-SHELL", "find /backups/.last_success -mmin -2600 | grep -q . || exit 1"]
      interval: 30s
      timeout: 30s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
        restart: true

######################################################
# RAG - System #
######################################################

  ai-service:
    build:
      context: ./ai-service
    container_name: ai-service
    user: "${UID:-1000}:${GID:-1000}"
    restart: unless-stopped
    expose:
      - "8000"
    env_file:
      - ./ai-service/.env
    environment:
      - PYTHONPATH=.
    volumes:
      - ./ai-service:/app
    networks:
      - backend_net
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    # Future:
    # depends_on:
    #   backend:
    #     condition: service_healthy

    # Future observability:
    # networks:
    #   - backend_net
    #   - monitor_net
    #
    # Prometheus:
    # - Add /metrics endpoint
    # - Add FastAPI metrics exporter
    #
    # Grafana:
    # - Add AI Service dashboard
    # - Monitor latency, requests, errors, token usage

  vault:
    build:
      context: ./vault
      dockerfile: ./Dockerfile
    container_name: vault
    restart: unless-stopped
    expose:
      - "8200"
    volumes:
    - ./vault/config:/vault/config
    - vault_data:/vault/data
    env_file: 
    - path: ./vault/vault.env
      required: true
    environment:
      VAULT_ADDR: "http://vault:8200"
    networks:
    - vault_net
    # healthcheck:
    #   test: ["CMD-SHELL", "curl -f -s 'http://127.0.0.1:8200/v1/sys/health?standbyok=true&sealedcode=200&uninitcode=200' || exit 1"]
    #   interval: 30s
    #   retries: 3
    #   start_period: 30s
    #   timeout: 5s
    depends_on:
      - db

volumes:
  postgres_db:
  caddy_data:
  caddy_config:
  grafana_data:
  prom_data:
  vault_data:

networks:
  backend_net:
    name: backend_net
  frontend_net:
    name: frontend_net
  backup_net:
    name: backup_net
  tunnel_net:
    name: tunnel_net
  vault_net:
    name: vault_net

secrets:
  vault_role_id:
    file: ./vault/secure/django/role_id
  vault_secret_id:
    file: ./vault/secure/django/secret_id
