services:
  caddy:
    image: caddy:2.11-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./backend/caddy/:/etc/caddy
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
    networks:
      - frontend_net
      - backend_net

  backend:
    build:
      context: ./backend
      dockerfile: django/Dockerfile
    container_name: django
    expose:
    - "8000"
    volumes:
      - ./backend/django:/app
    env_file:
      - .env
    networks:
      - backend_net
    depends_on:
      db:
        condition: service_healthy
        restart: true

  db:
    image: postgres:18
    container_name: postgres_db
    volumes:
      - ./backend/postgres_db/:/var/lib/postgresql/
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
    networks:
      - backend_net
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: ./Dockerfile
    container_name: nodejs
    expose:
      - "5173"
    working_dir: /home/node/app
    # environment:
      # - NODE_ENV=production
    volumes:
      - ./frontend/react-app/:/home/node/app
      - node_modules:/home/node/app/node_modules
    networks:
      - frontend_net


volumes:
  caddy_data:
  caddy_config:
  node_modules:

networks:
  backend_net:
    name: backend_net
  frontend_net:
    name: frontend_net