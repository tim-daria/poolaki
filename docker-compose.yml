######################################################
# HashiCorp Vault #
######################################################

  vault:
    build:
      context: ./vault
      dockerfile: ./Dockerfile
    container_name: vault
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    # expose:
    #   - "8200"
    ports:
    - "8200:8200"
    volumes:
    - ./vault/config:/vault/config
    - vault_data:/vault/data
    - vault_init:/vault/secure/
    - vault_id:/vault/secure/id
    - vault_agent:/vault/agent/secrets
    env_file: 
    - .env
    environment:
      TZ: Europe/Berlin
      VAULT_ADDR: ${VAULT_ADDR}
      VAULT_CONFIG: "/vault/config"
    networks:
    - vault_net
    healthcheck:
      test: ["CMD", "sh", "-c", "vault status | grep -q 'Sealed.*false'"]
      retries: 3
      start_period: 30s
      timeout: 5s
    depends_on:
      db:
        condition: service_healthy

  vault_agent:
    image: hashicorp/vault:2.0
    container_name: vault_agent
    entrypoint: ["vault", "agent", "-config=/vault/config/hcl/agent.hcl"]
    volumes:
      - ./vault/config/hcl/agent.hcl:/vault/config/hcl/agent.hcl
      - ./vault/agent/templates:/vault/agent/templates
      - vault_agent:/vault/agent/secrets
      - vault_id:/vault/secure/id
    environment:
      TZ: Europe/Berlin
      VAULT_ADDR: ${VAULT_ADDR}
    networks:
      - vault_net
    depends_on:
      vault:
        condition: service_started
      db:
        condition: service_healthy

volumes:
  postgres_db:
  caddy_data:
  caddy_config:
  grafana_data:
  prom_data:
  vault_data:
  vault_init:
  vault_id:
  vault_agent:

networks:
  backend_net:
    name: backend_net
  frontend_net:
    name: frontend_net
  backup_net:
    name: backup_net
  tunnel_net:
    name: tunnel_net
  vault_net:
    name: vault_net
