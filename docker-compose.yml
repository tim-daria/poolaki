services:
  caddy:
    image: caddy:2.11-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./backend/caddy/:/etc/caddy
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
    networks:
      - frontend_net
      - backend_net
      - monitor_net

  backend:
    build:
      context: ./backend
      dockerfile: django/Dockerfile
    container_name: django
    expose:
    - "8000"
    volumes:
      - ./backend/django:/app
    env_file:
      - .env
    networks:
      - backend_net
      - monitor_net
    depends_on:
      db:
        condition: service_healthy
        restart: true

  db:
    image: postgres:18
    container_name: postgres_db
    volumes:
      - postgres_db:/var/lib/postgresql/
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
    networks:
      - backend_net
      - monitor_net
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: ./Dockerfile
    container_name: nodejs
    expose:
      - "5173"
    working_dir: /home/node/app
    # environment:
      # - NODE_ENV=production
    volumes:
      - ./frontend:/home/node/app
      - node_modules:/home/node/app/node_modules
    networks:
      - frontend_net
      - monitor_net

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    expose:
      - "9090"
    restart: unless-stopped
    volumes:
      - ./backend/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./backend/monitoring/prometheus_data:/var/prometheus
    networks:
      - monitor_net
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"

  grafana:
    image: grafana/grafana:13.1
    container_name: grafana
    expose:
      - "3000"
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: "https://grafana.localhost"
    volumes:
      - ./backend/monitoring/grafana.yml:/etc/grafana/provisioning/datasources/prometheus.yml
      - ./backend/monitoring/grafana_data:/var/lib/grafana
    networks:
      - monitor_net


volumes:
  postgres_db:
  caddy_data:
  caddy_config:
  node_modules:
  prom_data:

networks:
  backend_net:
    name: backend_net
  frontend_net:
    name: frontend_net
  monitor_net:
    name: monitor_net