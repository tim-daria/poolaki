[project]
name = "ai-service"

# ai-service version
version = "0.1.0"

# Minimum supported Python version
requires-python = ">=3.12"

# Later: pgvector, embeddings and LLM client (when implemented)

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "pydantic-settings",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated.*"
]

[tool.mypy] plugins = ["pydantic.mypy"]

[tool.ruff.lint]
ignore = ["B008"]