name: CI

# Runs on every pull request targeting main, and on pushes to main.
# Only the part of the app that changed is built/tested. The `ci` job at the
# bottom always runs and is the single status check required by branch
# protection — so PRs never get stuck waiting on a job that didn't run.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # Detect which areas changed.
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      ai-service: ${{ steps.filter.outputs.ai-service }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3.0.2
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            ai-service:
              - 'ai-service/**'

  # Runs ONLY when backend/** changed.
  backend:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/django
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test_user"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
    env:
      POSTGRES_DB: test_db
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      DATABASE_USER: test_user
      DATABASE_PASSWORD: test_password
      DB_HOST: localhost
      DB_PORT: "5432"
      # Read at import time by core/services/ai_chat.py (strict env contract);
      # manage.py check/migrate/runserver all load the chat view.
      AI_SERVICE_URL: http://ai-service:8000
      AI_SERVICE_TIMEOUT: "90"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Ruff check (lint)
        run: uv run ruff check .

      - name: Ruff check (format)
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy .

      - name: Django system check
        run: uv run python manage.py check

      - name: Check for missing migrations
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Apply migrations
        run: uv run python manage.py migrate

      - name: Tests
        run: uv run pytest

      - name: Smoke test — server starts and responds
        run: |
          uv run python manage.py runserver 0.0.0.0:8000 &
          SERVER_PID=$!
          sleep 3
          curl --fail http://localhost:8000/health/ || (kill $SERVER_PID && exit 1)
          kill $SERVER_PID
  # ── Frontend — runs ONLY when frontend/** changed ─────────────────────────
  frontend:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        # Adjust this path to where package.json lives.
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          # Caches npm dependencies keyed on package-lock.json so subsequent
          # runs skip the full install when deps haven't changed.
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # ── Prettier ───────────────────────────────────────────────────────────
      # The counterpart to the backend's `ruff format --check`. Without it,
      # formatting depends on whether each contributor's editor happens to
      # have the extension configured.
      - name: Prettier
        run: npm run format:check

      # ── ESLint ─────────────────────────────────────────────────────────────
      # Runs ESLint directly on the host (no Docker needed — ESLint has no
      # runtime dependency on backend or database).
      - name: ESLint
        run: npm run lint

      # ── Vitest ─────────────────────────────────────────────────────────────
      # Unit tests for the pure modules (money parsing, filters, validation,
      # error mapping). Node environment only; nothing here needs the stack.
      - name: Unit tests
        run: npm run test

      # ── Build ──────────────────────────────────────────────────────────────
      # Typechecks and bundles. ESLint alone does not resolve imports, so
      # without this a branch whose package.json is missing a dependency the
      # source imports still passes CI green — it only breaks on a clean
      # checkout, once no one's stale node_modules is masking it.
      - name: Build
        run: npm run build

      # ── Playwright: component / visual tests ───────────────────────────────
      # Component tests mount components in isolation (no server needed),
      # so they also run directly on the host via Playwright's experimental
      # component testing mode. If you're using Storybook or similar instead,
      # replace this step accordingly.
      # - name: Cache Playwright browsers
      #   uses: actions/cache@v4
      #   with:
      #     # Playwright stores browser binaries outside the project; cache them
      #     # so we don't re-download ~300 MB of Chromium on every run.
      #     path: ~/.cache/ms-playwright
      #     key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      # - name: Install Playwright browsers
      #   # --with-deps also installs OS-level shared libraries (fonts, audio,
      #   # etc.) that Chromium needs. Only installs what the cache missed.
      #   run: npx playwright install --with-deps chromium

      # - name: Playwright component tests
      #   run: npm run test:components

    # Always runs on every PR — catches backend changes that break the frontend.
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Create .env for CI
        working-directory: .
        run: |
          cat > .env << EOF 
          POSTGRES_DB=${{ secrets.POSTGRES_DB }}
          POSTGRES_USER=${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          DB_HOST=db
          DB_PORT=5432
          VAULT_ADDR=${{ secrets.VAULT_ADDR }}
          DJANGO_SUPERUSER_USERNAME=${{ secrets.DJANGO_SUPERUSER_USERNAME }}
          DJANGO_SUPERUSER_EMAIL=${{ secrets.DJANGO_SUPERUSER_EMAIL }}
          DJANGO_SUPERUSER_PASSWORD=${{ secrets.DJANGO_SUPERUSER_PASSWORD }}
          INTRA42_CLIENT_ID=${{ secrets.INTRA42_CLIENT_ID }}
          INTRA42_CLIENT_SECRET=${{ secrets.INTRA42_CLIENT_SECRET }}
          GF_ADMIN_USER=${{ secrets.GF_ADMIN_USER }}
          GF_ADMIN_PASSWORD=${{ secrets.GF_ADMIN_PASSWORD }}
          SMTP_USER=
          SMTP_PASSWORD=
          SMTP_FROM_ADDRESS=
          TUNNEL_TOKEN=
          TZ=Europe/Berlin
          LLM_MODEL=AI
          LLM_API_KEY=123abc
          LLM_BASE_URL=www.llm.com
          DJANGO_BASE_URL=http://django:8000
          LOG_LEVEL=Warning
          LLM_TIMEOUT=30
          EOF

      - name: Create optional AI service env for CI
        working-directory: .
        run: |
          mkdir -p ai-service
          touch ai-service/.env

      # Chromium and curl both need the hostname Caddy serves. Runners do not
      # resolve *.localhost, so point it at the loopback explicitly.
      - name: Resolve the Caddy hostname
        run: echo "127.0.0.1 poolaki.localhost" | sudo tee -a /etc/hosts

      # ── Playwright: e2e tests (full stack via docker compose) ──────────────
      # E2e tests need the real app running, and they run through Caddy, the
      # same front door as production. Caddy serves plain HTTP here
      # (auto_https is off in the Caddyfile), so there is no self-signed
      # certificate for Chromium to reject — the reason this job used to skip
      # it. Going direct to Vite hid a WAF rule that rejected every DELETE.
      #
      # The backend entrypoint sources DB credentials from Vault agent files
      # and applies migrations itself before /health/ responds, so no extra
      # `docker compose exec ... migrate` is needed (and it would fail: an
      # exec'd process does not inherit the sourced credentials).
      - name: Start services via docker compose
        working-directory: .
        env:
          COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
        run: |
          docker compose up -d --build
          echo "Waiting for frontend..."
          timeout 180 bash -c 'until curl -sf http://localhost:5173; do sleep 2; done'
          echo "Waiting for backend..."
          timeout 180 bash -c 'until curl -sf http://localhost:8000/health/; do sleep 2; done'
          echo "Waiting for Caddy..."
          timeout 180 bash -c 'until curl -sf http://poolaki.localhost:8080 >/dev/null; do sleep 2; done'

      # Fails in seconds when a rule change starts eating a method the app
      # uses, instead of leaving it to be found in production. Caddy sets
      # X-Blocked on anything the WAF refuses, so that header is the signal.
      # The status is not: Django answers 401 or 403 to these unauthenticated
      # probes, and that is a pass as far as this check is concerned.
      #
      # POST and PATCH carry a JSON body because CRS rejects a body-less POST
      # on its own protocol rules, and GET and DELETE must not carry one for
      # the same reason. The point is the method policy, not those rules.
      - name: WAF allows the methods the app uses
        run: |
          set -e
          check() {
            method="$1"
            shift
            blocked=$(curl -s -o /dev/null -D - -X "$method" "$@" \
              http://poolaki.localhost:8080/api/v1/organizations/ \
              | grep -ci '^x-blocked:' || true)
            if [ "$blocked" != "0" ]; then
              echo "::error::$method is refused by the WAF before reaching Django"
              exit 1
            fi
            echo "$method reached the application"
          }
          check GET
          check DELETE
          check POST -H 'Content-Type: application/json' -d '{}'
          check PATCH -H 'Content-Type: application/json' -d '{}'

      - name: Playwright e2e tests
        env:
          BASE_URL: http://poolaki.localhost:8080
          BACKEND_URL: http://localhost:8000 # optional, if your tests call the API directly
        run: npm run test:e2e

      - name: Debug on failure
        if: failure()
        working-directory: .
        env:
          COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
        run: |
          docker compose ps
          docker compose logs vault
          docker compose logs backend
          # Caddy's log names the rule id behind any WAF refusal, which is the
          # only place a blocked request is explained.
          docker compose logs caddy

      - name: Upload Playwright report
        # Always upload the HTML report so you can inspect failures even when
        # the job itself is green. The report is kept for 7 days.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Stop services
        if: always()
        working-directory: .
        env:
          COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
        run: docker compose down

  # ── ai-service — runs ONLY when ai-service/** changed ─────────────────────────
  ai-service:
    needs: changes
    if: ${{ needs.changes.outputs.ai-service == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --all-extras --all-groups

      - name: Ruff check (lint)
        run: uv run ruff check .

      - name: Ruff check (format)
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy .

      - name: Tests
        run: uv run pytest

  # ── Required status check ─────────────────────────────────────────────────
  # Always runs; fails only if a job that actually ran failed.
  # This is the single check to enable in branch protection settings.
  ci:
    needs: [backend, frontend, ai-service, e2e]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs passed
        run: |
          backend='${{ needs.backend.result }}'
          frontend='${{ needs.frontend.result }}'
          ai_service='${{ needs.ai-service.result }}'
          e2e='${{ needs.e2e.result }}'

          status="backend=$backend, frontend=$frontend, ai-service=$ai_service, e2e=$e2e"
          failed=0
          for result in "$backend" "$frontend" "$ai_service" "$e2e"; do
            # "skipped" is expected — jobs only run when their area changed.
            # Anything other than success/skipped (failure, cancelled,
            # timed_out) must fail the gate.
            case "$result" in
              success|skipped) ;;
              *) failed=1 ;;
            esac
          done

          if [[ $failed -eq 1 ]]; then
            echo "A required job did not pass ($status)."
            exit 1
          fi
          echo "CI gate passed ($status)."
