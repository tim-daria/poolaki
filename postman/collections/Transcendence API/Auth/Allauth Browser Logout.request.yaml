$kind: http-request
method: DELETE
url: '{{base_url}}/_allauth/browser/v1/auth/session'
order: 12000
headers:
  - key: X-CSRFToken
    value: '{{csrf_token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      if (pm.response.code >= 200 && pm.response.code < 300) {
        pm.environment.set('is_authenticated', 'false');
        pm.environment.set('current_user_id', '');
        pm.environment.set('current_username', '');
        pm.environment.set('current_email', '');
      }