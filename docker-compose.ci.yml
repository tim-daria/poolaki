# CI override — strips monitoring and the tunnel, exposes ports to the host.
# Used via COMPOSE_FILE=docker-compose.yml:docker-compose.ci.yml
#
# Caddy stays up. It carries the Coraza WAF, and a rule there can break the
# app without any application code changing: the OWASP CRS default method
# policy once rejected every DELETE, which killed logout and member removal
# while the tests — running straight against Vite — stayed green. The base
# file already publishes it on 8080, and it serves plain HTTP (auto_https is
# off), so there is no certificate for Chromium to reject.

services:

  cloudflared:
    profiles: [donotstart]

  prometheus:
    profiles: [donotstart]

  grafana:
    profiles: [donotstart]

  postgres_exporter:
    profiles: [donotstart]

  cadvisor:
    profiles: [donotstart]

  db_backup:
    profiles: [donotstart]

  frontend:
    ports:
      - "5173:5173"
    networks:
      - backend_net

  backend:
    ports:
      - "8000:8000"
    networks:
      - backend_net